[project]
name = "kyl-server"
version = "0.0.9"
description = "KYL Backend with Api handler"
readme = "readme.md"
requires-python = ">=3.14"
dependencies = [
    "bcrypt>=5.0.0",
    "blake3>=1.0.10",
    "flask>=3.1.3",
    "flask-sqlalchemy>=3.1.1",
    "gunicorn>=26.2.0",
    "psycopg2-binary>=2.9.13",
    "sqlalchemy>=2.0.53",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
markers = [
    "integration: needs the test PostgreSQL (docker compose -f compose.test.yml up -d)",
]
